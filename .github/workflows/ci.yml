name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Change-scoped : l'analyse d'impact (appfactory, epinglee par SHA revu) traduit
# les chemins touches en gates ; chaque job ne tourne que si sa gate est requise.
# `workflow_dispatch` force toutes les surfaces.
jobs:
  impact:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-impact-analysis.yml@8847e4888fc4021060f06ba29f0cf94677ed2d7d
    with:
      appfactory_ref: 8847e4888fc4021060f06ba29f0cf94677ed2d7d
      config_path: .github/appfactory-impact.json
      mode: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}

  api:
    name: API (pytest)
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'api') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -q -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    name: Interface (vitest + build)
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'web') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  cerbos:
    name: Policies Cerbos (compile + tests)
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'cerbos') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "${{ github.workspace }}/cerbos:/work"             ghcr.io/cerbos/cerbos:0.40.0 compile --tests=/work/tests /work/policies

  conteneurs:
    name: Images et compose
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'conteneurs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      # Le compose de prod exige les variables que deploy.sh derive ou genere :
      # on fournit des valeurs factices, uniquement pour valider le fichier.
      - run: docker compose -f docker-compose.prod.yml --env-file env.prod.example config -q
        env:
          SECRET_KEY: ci-validation-seulement
          POSTGRES_PASSWORD: ci-validation-seulement
          ALLOWED_HOSTS: projets.example,localhost,127.0.0.1
          ORIGINES_AUTORISEES: https://projets.example
          COOKIE_SECURE: "True"
      - run: docker build -q -t cfao-projets-api:ci api
      - run: docker build -q -t cfao-projets-gateway:ci -f gateway/Dockerfile .
